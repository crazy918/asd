<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* MC主菜单深色半透明背景 */
            background: #3f3f3f url("");
            background-color: #474747;
            background-image: linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "Microsoft YaHei",sans-serif;
        }
        .mc-title {
            color: #ffffff;
            font-size:48px;
            text-shadow: 4px 4px 0 #222222;
            letter-spacing:2px;
            margin-bottom:48px;
            font-weight:bold;
        }
        .mc-btn {
            width:280px;
            height:52px;
            margin:12px 0;
            font-size:18px;
            /* MC原版按钮配色 */
            background-color:#727272;
            border:3px solid #000000;
            border-top-color:#aaaaaa;
            border-left-color:#aaaaaa;
            border-right-color:#333333;
            border-bottom-color:#333333;
            color:#ffffff;
            cursor:pointer;
            transition: 0.08s;
        }
        .mc-btn:hover {
            background-color:#88b8ff;
        }
        .mc-btn:active {
            border-top-color:#333333;
            border-left-color:#333333;
            border-right-color:#aaaaaa;
            border-bottom-color:#aaaaaa;
        }
    </style>
</head>
<body>
    <div class="mc-title">MINECRAFT WEB</div>

    <!-- 当前页面跳转，location.href 不新开标签 -->
    <button class="mc-btn" onclick="location.href='js.html'">JS版本</button>
    <button class="mc-btn" onclick="location.href='wasm.html'">WASM版本</button>

</body>
</html>
