<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eaglercraft启动</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #2c3e50, #4a69bd);
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .btn-wrap {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 16px 32px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s ease;
        }
        #openWasm {
            background: #27ae60;
            color: #fff;
        }
        #openWasm:hover {
            background: #2ecc71;
            transform: translateY(-3px);
        }
        #openJs {
            background: #e67e22;
            color: #fff;
        }
        #openJs:hover {
            background: #f39c12;
            transform: translateY(-3px);
        }
        .tip {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🏠 工具选择</h1>
        <div class="btn-wrap">
            <!-- target="_blank" 新标签页打开 -->
            <button id="openWasm" onclick="window.open('wasm.html','_blank')">Wasm 版</button>
            <button id="openJs" onclick="window.open('js.html','_blank')">J版S</button>
        </div>
        <div class="tip">
            Powered by 自建局域网服务 | 2026
        </div>
    </div>
</body>
</html>
