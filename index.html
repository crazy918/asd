<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Java Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            /* 暗蓝科技背景，模仿Java版科技模组 */
            background: #181b26;
            background-image: radial-gradient(circle at 20% 10%, #202b42 0%, #181b26 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, "Microsoft YaHei", sans-serif;
        }

        /* 玻璃拟态主面板 仿Java模组GUI */
        .glass-panel {
            width: 420px;
            padding: 48px 36px;
            background: rgba(34, 42, 60, 0.42);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 190, 255, 0.25);
            border-radius: 14px;
            box-shadow:
                0 0 35px rgba(45, 160, 255, 0.18),
                inset 0 0 0 1px rgba(120, 200, 255, 0.08);
        }

        /* MC像素标题 Java版风格 */
        .mc-title {
            text-align: center;
            color: #e6f4ff;
            font-size: 44px;
            letter-spacing: 3px;
            text-shadow:
                0 0 10px #40b8ff,
                3px 3px 0 #111827;
            margin-bottom: 42px;
            font-weight: bold;
        }

        /* Java版MC科技风按钮 */
        .tech-btn {
            width: 100%;
            height: 56px;
            margin:14px 0;
            font-size:19px;
            color:#ffffff;
            background: rgba(52, 88, 130, 0.45);
            backdrop-filter: blur(6px);
            border: 2px solid rgba(70, 180, 255, 0.45);
            border-radius: 6px;
            cursor: pointer;
            transition: 0.12s ease;
            box-shadow: 0 2px 12px rgba(30,140,230,0.15);
        }

        .tech-btn:hover {
            background:rgba(64, 144, 212, 0.65);
            border-color:rgba(90, 200, 255, 0.75);
            box-shadow: 0 0 22px rgba(40,170,255,0.35);
        }

        .tech-btn:active {
            transform: scale(0.97);
            background:rgba(36, 72, 114, 0.6);
        }

        .tip-text {
            margin-top:36px;
            text-align:center;
            color:#87a8c7;
            font-size:14px;
        }
    </style>
</head>
<body>
    <div class="glass-panel">
        <div class="mc-title">JAVA WEB MC</div>

        <!-- 当前标签页跳转，location.href 不新开窗口 -->
        <button class="tech-btn" onclick="location.href='js.html'">JS 客户端</button>
        <button class="tech-btn" onclick="location.href='wasm.html'">WASM 客户端</button>

        <div class="tip-text">Minecraft Java Edition Web Launcher</div>
    </div>
</body>
</html>
